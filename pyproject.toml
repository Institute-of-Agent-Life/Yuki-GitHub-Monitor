[project]
name = "yuki-github-monitor"
version = "1.2.2"
description = "GitHub repository notifications for Yuki Plugin API 8.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic>=2.7,<3",
    "pillow>=11,<13",
    "tzdata>=2025.2",
]

[project.urls]
Repository = "https://github.com/Institute-of-Agent-Life/Yuki-GitHub-Monitor"
Issues = "https://github.com/Institute-of-Agent-Life/Yuki-GitHub-Monitor/issues"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "yuki @ https://github.com/YuanYeYouTao/Yuki/archive/0ee2331003821f7d7ff9225a9d882f9f822dfde8.tar.gz",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
